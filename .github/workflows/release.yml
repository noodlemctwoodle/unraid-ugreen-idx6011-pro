name: release

# Cut a release straight from the repo. Maintainer flow:
#   1. Bump <!ENTITY version> and add a ###<version> block to CHANGES in the .plg.
#   2. Commit + push to main.
#   3. Actions -> "release" -> Run workflow.
#
# Ordering matters and is deliberate: the GitHub release (with the .txz asset) is
# PUBLISHED FIRST, then the payload's SHA256 is synced into the .plg on main via a
# pull request. Publishing first means a slow / code-scanning-blocked SHA-sync PR can
# never lose the built payload (mkpayload output is not byte-reproducible, so a lost
# payload can't be rebuilt to the same hash). The SHA is taken from the PUBLISHED
# asset, and the sync runs even when the release already exists, so a re-run always
# reconciles the .plg hash even if a previous sync PR never merged. The sync-merge is
# best-effort and non-fatal: if code scanning is slow, the job still succeeds and the
# SHA PR is merged (auto-merge) or left for a manual merge.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Repo-admin PAT: lets the SHA-sync push/PR to protected main.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Read plugin version
        id: meta
        run: |
          VER=$(grep -oP '<!ENTITY\s+version\s+"\K[^"]+' ugreen-idx6011-pro.plg)
          [ -n "$VER" ] || { echo "::error::could not read <!ENTITY version> from .plg"; exit 1; }
          case "$VER" in *[!0-9A-Za-z.]*) echo "::error::unexpected version '$VER'"; exit 1;; esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VER"

      - name: Does this release already exist?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release $VER already exists - skipping build/publish, only reconciling the .plg SHA"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- build + publish (only when the release does not yet exist) --------------
      - name: Build panel_dash from source
        if: steps.exists.outputs.already == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libdrm-dev
          bash src/panel/build.sh
          ls -la src/panel/panel_dash
          file src/panel/panel_dash || true

      - name: Build payload
        if: steps.exists.outputs.already == 'false'
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: bash release/mkpayload.sh "$VER"

      - name: Build release notes
        if: steps.exists.outputs.already == 'false'
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          # changelog block for this version, from the .plg CHANGES
          awk -v v="###${VER}" '
            $0==v {grab=1; next}
            /^###/ {if (grab) exit}
            grab {print}
          ' ugreen-idx6011-pro.plg > changelog.txt
          [ -s changelog.txt ] || echo "- maintenance release" > changelog.txt
          PLG="https://raw.githubusercontent.com/noodlemctwoodle/unraid-ugreen-idx6011-pro/main/ugreen-idx6011-pro.plg"
          {
            echo 'Touch **LCD dashboard** + smart **front-panel LEDs** for the **UGREEN NASync iDX6011 Pro** running **Unraid** - the full front panel, working natively, no UGOS required.'
            echo ''
            echo '## Install / update'
            echo ''
            echo 'In the Unraid web UI: **Plugins -> Install Plugin**, paste this URL and install:'
            echo ''
            echo '```'
            echo "$PLG"
            echo '```'
            echo ''
            echo 'Then **reboot**. The plugin downloads a SHA256-verified payload, stages everything, and registers its own EFI boot entry; the 258x960 touch panel lights once the box boots that entry.'
            echo ''
            echo 'If the panel stays dark after rebooting, make the entry first in the BIOS: **Boot > UEFI USB Hard Disk Drive BBS Priorities > `Unraid (iDX6011 panel)`**.'
            echo ''
            echo '> **Kernel-matched:** the bundled touch modules + display overlay are built for **kernel 6.18.38-Unraid (Unraid 7.3.2)**. On a different Unraid kernel the panel stays dark until you rebuild them with `boot/build-overlay.sh` (see the runbook).'
            echo ''
            echo "## What's changed in ${VER}"
            echo ''
            cat changelog.txt
            echo ''
            echo '---'
            echo 'Docs & source: https://github.com/noodlemctwoodle/unraid-ugreen-idx6011-pro#readme'
          } > notes.md
          echo "---- notes ----"; cat notes.md

      - name: Publish release (asset first - never lost to a sync race)
        if: steps.exists.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "$VER" "release/ugreen-idx6011-pro-$VER.txz" \
            --target main --title "$VER" --notes-file notes.md

      # ---- reconcile the .plg SHA on main from the PUBLISHED asset (always) --------
      - name: Compute SHA256 from the published asset
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          rm -rf _asset && mkdir -p _asset
          gh release download "$VER" --pattern "ugreen-idx6011-pro-$VER.txz" --dir _asset --clobber
          SHA=$(sha256sum "_asset/ugreen-idx6011-pro-$VER.txz" | awk '{print $1}')
          [ -n "$SHA" ] || { echo "::error::could not hash the published asset"; exit 1; }
          echo "published asset SHA256: $SHA"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Sync .plg <SHA256> to main via pull request (no race - asset is published)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VER: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha256 }}
        run: |
          git config user.name  "noodlemctwoodle"
          git config user.email "noodlemctwoodle@users.noreply.github.com"
          git fetch origin main
          BRANCH="ci/plg-sha-${VER}"
          # Base the sync branch on the freshest main; wipe any stale copy from a prior run.
          git branch -D "$BRANCH" 2>/dev/null || true
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -B "$BRANCH" origin/main
          sed -i -E "s#<SHA256>[0-9a-fA-F]*</SHA256>#<SHA256>${SHA}</SHA256>#" ugreen-idx6011-pro.plg
          if git diff --quiet -- ugreen-idx6011-pro.plg; then
            echo "::notice::.plg SHA256 already matches the published asset - nothing to sync"
            exit 0
          fi
          git add ugreen-idx6011-pro.plg
          git commit -m "ci: sync .plg SHA256 for ${VER}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "ci: sync .plg SHA256 for ${VER}" \
            --body "Automated payload SHA256 for the **${VER}** release (already published as a GitHub release). Safe to merge once code scanning passes." || true
          # Best-effort, non-fatal: enable auto-merge (merges when checks pass), else try an
          # immediate merge, else leave the PR for a manual merge. The release is already out.
          if gh pr merge "$BRANCH" --auto --merge --delete-branch 2>/dev/null; then
            echo "::notice::auto-merge enabled on the SHA PR - it will merge when code scanning passes"
          elif gh pr merge "$BRANCH" --merge --delete-branch 2>/dev/null; then
            echo "::notice::SHA PR merged"
          else
            echo "::warning::SHA PR '$BRANCH' left open - the ${VER} release IS published; merge the PR to finish syncing the .plg hash"
          fi
