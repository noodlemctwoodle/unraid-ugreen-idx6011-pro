name: auto-assign-copilot

# Acknowledge every newly opened issue and hand it to the Copilot coding agent, so
# a reporter gets an immediate response and triage starts without waiting on a
# maintainer. Assignment is the trigger: once assigned, the agent picks the issue
# up, works it and opens a draft PR.
#
# WHY A PAT AND NOT GITHUB_TOKEN: the Copilot assignment API rejects GitHub App
# installation tokens, and the built-in GITHUB_TOKEN is one. A fine-grained PAT is
# currently the only token that can assign copilot-swe-agent, so the assign step
# reads COPILOT_ASSIGN_TOKEN (Settings > Secrets and variables > Actions; needs
# Issues: read+write on this repository). Without that secret the step logs a
# notice and exits clean, so a missing or expired token never blocks an issue being
# filed — and the greeting below adjusts its wording to match.
#
# The greeting deliberately uses the default GITHUB_TOKEN: commenting doesn't need
# the PAT, so the PAT stays scoped to the one thing only it can do.
#
# The agent is a Bot actor and is invisible to the REST assignee endpoint, so
# assignment goes through GraphQL. replaceActorsForAssignable replaces the whole
# assignee list, so existing assignees are read first and preserved.
#
# Bot-authored issues are skipped entirely, so dependabot et al. don't spawn agent
# sessions. Issues opened by the repo owner are assigned but not greeted — no point
# thanking yourself for your own bug report.

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: auto-assign-copilot-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assign:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Assign the Copilot coding agent
        id: assign
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          echo "assigned=false" >> "$GITHUB_OUTPUT"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::COPILOT_ASSIGN_TOKEN is not set — skipping Copilot assignment."
            exit 0
          fi

          BOT_ID=$(gh api graphql -f query='
            query($owner:String!,$name:String!){
              repository(owner:$owner,name:$name){
                suggestedActors(capabilities:[CAN_BE_ASSIGNED], first:100){
                  nodes{ login __typename ... on Bot { id } }
                }
              }
            }' -F owner="$OWNER" -F name="$REPO" \
            --jq '.data.repository.suggestedActors.nodes[]
                  | select(.login=="copilot-swe-agent") | .id')

          if [ -z "$BOT_ID" ]; then
            echo "::warning::copilot-swe-agent is not assignable here — is the coding agent enabled for this repository?"
            exit 0
          fi

          ISSUE_JSON=$(gh api graphql -f query='
            query($owner:String!,$name:String!,$num:Int!){
              repository(owner:$owner,name:$name){
                issue(number:$num){ id assignees(first:20){ nodes{ id } } }
              }
            }' -F owner="$OWNER" -F name="$REPO" -F num="$NUM")

          ISSUE_ID=$(printf '%s' "$ISSUE_JSON" | jq -r '.data.repository.issue.id')
          ACTORS=$(printf '%s' "$ISSUE_JSON" \
            | jq -c --arg bot "$BOT_ID" \
                '[.data.repository.issue.assignees.nodes[].id] + [$bot] | unique')

          jq -n --arg id "$ISSUE_ID" --argjson actors "$ACTORS" '{
            query: "mutation($assignable:ID!,$actors:[ID!]!){
                      replaceActorsForAssignable(input:{assignableId:$assignable, actorIds:$actors}){
                        assignable{ ... on Issue { number assignees(first:20){ nodes{ login } } } }
                      }
                    }",
            variables: { assignable: $id, actors: $actors }
          }' | gh api graphql --input - >/dev/null

          echo "assigned=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Assigned copilot-swe-agent to issue #${NUM}"

      - name: Thank the reporter
        if: github.event.issue.author_association != 'OWNER'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
          ASSIGNED: ${{ steps.assign.outputs.assigned }}
        run: |
          set -euo pipefail
          {
            echo "Thanks for raising this — much appreciated."
            echo
            if [ "$ASSIGNED" = "true" ]; then
              echo "It's been picked up for a first look, so you may see a draft pull"
              echo "request linked here shortly. Nothing gets merged without a"
              echo "maintainer reviewing it first."
            else
              echo "A maintainer will take a look shortly."
            fi
            echo
            echo "If you haven't already, the things that speed this up most are your"
            echo "Unraid and plugin versions, the output of \`uname -r\`, and anything"
            echo "relevant from \`/var/log/panel_dash.log\` or \`dmesg\`."
          } > body.md
          gh issue comment "$NUM" --repo "$REPO" --body-file body.md
